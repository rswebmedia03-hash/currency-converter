```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="converter">
    <h1>Currency Converter</h1>
    <p class="subtitle">Convert currencies with exchange rates.</p>

    <form id="converter-form">
      <label for="amount">Amount</label>
      <input id="amount" type="number" min="0.000001" step="any" value="1" required>

      <div class="currency-row">
        <div>
          <label for="from">From</label>
          <select id="from">
            <option value="USD" selected>USD — US Dollar</option>
            <option value="INR">INR — Indian Rupee</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="JPY">JPY — Japanese Yen</option>
            <option value="AUD">AUD — Australian Dollar</option>
            <option value="CAD">CAD — Canadian Dollar</option>
          </select>
        </div>

        <button type="button" id="swap" class="swap" aria-label="Swap currencies">⇄</button>

        <div>
          <label for="to">To</label>
          <select id="to">
            <option value="USD">USD — US Dollar</option>
            <option value="INR" selected>INR — Indian Rupee</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — British Pound</option>
            <option value="JPY">JPY — Japanese Yen</option>
            <option value="AUD">AUD — Australian Dollar</option>
            <option value="CAD">CAD — Canadian Dollar</option>
          </select>
        </div>
      </div>

      <button class="convert" type="submit">Convert Currency</button>
    </form>

    <section class="result" aria-live="polite">
      <p id="status">Ready to convert</p>
      <h2 id="output">—</h2>
      <p id="rate"></p>
    </section>

    <p class="note">Exchange rates are provided by Frankfurter. Bank rates may differ.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
```
